    <text x="20" y="32" fill="#8795a3" font-size="13" letter-spacing="2">THIS MONTH'S RENT · COLLECTED</text>
    <text x="20" y="72" fill="#14202b" font-size="40" font-weight="800">$5,378</text>
    <g font-size="13.5">
      <rect x="20" y="92" width="196" height="26" rx="7" fill="#f4f8fc"/>
      <text x="32" y="109" fill="#2f3e4b">88 Oak St · Unit 1</text>
      <text x="204" y="109" fill="#2f8f5b" text-anchor="end" font-weight="700">Paid</text>
      <rect x="20" y="124" width="196" height="26" rx="7" fill="#f4f8fc"/>
      <text x="32" y="141" fill="#2f3e4b">412 Maple Ave · U2</text>
      <text x="204" y="141" fill="#2f8f5b" text-anchor="end" font-weight="700">Paid</text>
