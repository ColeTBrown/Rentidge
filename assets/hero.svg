      <text x="26" y="0" fill="#5b6b7a" font-size="19" letter-spacing="4" font-weight="600">PROPERTY MANAGEMENT, SIMPLIFIED</text>
    </g>
    <text x="78" y="200" font-size="96" font-weight="800">
