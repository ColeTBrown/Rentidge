    </text>
    <text x="80" y="250" fill="#2f3e4b" font-size="29">Rent collection that doesn't feel like a second job.</text>
    <text x="80" y="290" fill="#6b7885" font-size="19">Online rent, autopay, maintenance requests, and books — all on autopilot.</text>
  </g>
  <g transform="translate(956,70)" font-family="ui-sans-serif, sans-serif">
